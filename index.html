<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کتابخانه حدیث شیعه</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7fa;margin:0;color:#17202a}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}input,textarea,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd3da;border-radius:11px;font-size:16px;margin:6px 0 12px}textarea{min-height:120px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:700}.primary{background:#1769e0;color:#fff}.result{border-top:1px solid #eee;padding:16px 0}.hadith{font-size:19px;line-height:2}mark{background:#fff36a}.small{color:#667;font-size:13px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>📚 کتابخانه حدیث شیعه</h1><p>جستجو و ثبت احادیث</p><div class="card"><h2>🔎 جستجو</h2><input id="search" placeholder="عبارت، شخص، کتاب، جلد، باب یا شماره حدیث..."><div class="grid"><select id="person"><option value="">همه اشخاص</option></select><select id="book"><option value="">همه کتاب‌ها</option></select></div><div id="results"></div></div><div class="card"><h2>➕ افزودن حدیث</h2><div class="grid"><input id="fPerson" placeholder="شخص / راوی"><input id="fBook" placeholder="کتاب"><input id="fVolume" placeholder="جلد"><input id="fChapter" placeholder="باب"><input id="fPage" placeholder="صفحه"><input id="fNumber" placeholder="شماره حدیث"></div><textarea id="fText" placeholder="متن حدیث"></textarea><textarea id="fTranslation" placeholder="ترجمه"></textarea><input id="fTags" placeholder="موضوع / برچسب"><button class="primary" onclick="addHadith()">ذخیره حدیث</button><p id="msg" class="small"></p></div></div><script>const KEY='shia_hadith_library_v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function hl(s,q){let x=esc(s);if(!q)return x;for(const w of q.trim().split(/\s+/).filter(Boolean)){let e=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{x=x.replace(new RegExp('('+e+')','gi'),'<mark>$1</mark>')}catch(_){}}return x}function filters(){let ps=[...new Set(data.map(x=>x.person).filter(Boolean))].sort(),bs=[...new Set(data.map(x=>x.book).filter(Boolean))].sort();$('person').innerHTML='<option value="">همه اشخاص</option>'+ps.map(x=>'<option>'+esc(x)+'</option>').join('');$('book').innerHTML='<option value="">همه کتاب‌ها</option>'+bs.map(x=>'<option>'+esc(x)+'</option>').join('')}function search(){let q=$('search').value.trim().toLowerCase(),p=$('person').value,b=$('book').value;let rows=data.filter(x=>(!p||x.person===p)&&(!b||x.book===b)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));$('results').innerHTML=rows.length?rows.map(x=>'<div class="result"><div class="small">👤 '+esc(x.person)+' | 📖 '+esc(x.book)+' | جلد '+esc(x.volume)+' | باب '+esc(x.chapter)+' | صفحه '+esc(x.page)+' | حدیث '+esc(x.number)+'</div><div class="hadith">'+hl(x.text,q)+'</div>'+(x.translation?'<p><b>ترجمه:</b> '+hl(x.translation,q)+'</p>':'')+(x.tags?'<div class="small">🏷️ '+esc(x.tags)+'</div>':'')+'</div>').join(''):'<div class="small">حدیثی پیدا نشد.</div>'}function addHadith(){let x={person:$('fPerson').value.trim(),book:$('fBook').value.trim(),volume:$('fVolume').value.trim(),chapter:$('fChapter').value.trim(),page:$('fPage').value.trim(),number:$('fNumber').value.trim(),text:$('fText').value.trim(),translation:$('fTranslation').value.trim(),tags:$('fTags').value.trim()};if(!x.text){$('msg').textContent='⚠️ متن حدیث را وارد کنید.';return}data.unshift(x);save();filters();$('msg').textContent='✅ حدیث ذخیره شد.';['fPerson','fBook','fVolume','fChapter','fPage','fNumber','fText','fTranslation','fTags'].forEach(id=>$(id).value='');search()}$('search').oninput=search;$('person').onchange=search;$('book').onchange=search;filters();search();</script></body></html>
