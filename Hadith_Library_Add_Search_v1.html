<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کتابخانه حدیث من</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f5f6f8;margin:0;color:#171717}
.wrap{max-width:760px;margin:auto;padding:18px}
h1{font-size:25px;margin:8px 0 4px}.sub{color:#666;margin-bottom:18px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #00000010}
label{display:block;font-weight:700;margin:10px 0 5px}
input,textarea{box-sizing:border-box;width:100%;border:1px solid #d5d7dc;border-radius:10px;padding:11px;font-size:16px;background:#fff}
textarea{min-height:110px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:11px;padding:12px 14px;font-size:16px;font-weight:700;margin:5px 3px;cursor:pointer}
.primary{background:#1769e0;color:white}.secondary{background:#eef1f5}.danger{background:#ffe9e9;color:#b00020}
.result{border-top:1px solid #eee;padding:14px 0}.meta{color:#666;font-size:14px;line-height:1.8}
.hadith{font-size:18px;line-height:2;margin:8px 0;white-space:pre-wrap}
mark{background:#fff36a;padding:1px 2px;border-radius:3px}
.empty{color:#777;text-align:center;padding:18px}
.notice{background:#fff8d9;border:1px solid #eadb8a;border-radius:12px;padding:12px;line-height:1.8}
.small{font-size:13px;color:#777}
</style>
</head>
<body>
<div class="wrap">
<h1>📚 کتابخانه حدیث من</h1>
<div class="sub">حدیث‌ها را خودت اضافه، جستجو و پشتیبان‌گیری کن.</div>

<div class="notice">💡 اطلاعات ابتدا در همین دستگاه ذخیره می‌شود. برای اطمینان، هر چند وقت یک‌بار از دکمه «پشتیبان‌گیری» استفاده کن.</div>

<div class="card">
<h2>➕ افزودن حدیث</h2>
<div class="grid">
<div><label>👤 شخص / راوی</label><input id="person" placeholder="مثلاً امام علی علیه‌السلام"></div>
<div><label>📚 کتاب</label><input id="book" placeholder="مثلاً الکافی"></div>
<div><label>📖 جلد</label><input id="volume" placeholder="مثلاً ۱"></div>
<div><label>📑 فصل / باب</label><input id="chapter" placeholder="نام فصل یا باب"></div>
<div><label>🔢 شماره حدیث</label><input id="number" placeholder="مثلاً ۱۲۳"></div>
<div><label>📄 صفحه</label><input id="page" placeholder="مثلاً ۴۵"></div>
</div>
<label>📝 متن حدیث</label>
<textarea id="text" placeholder="متن کامل حدیث را وارد کن"></textarea>
<label>🌍 ترجمه</label>
<textarea id="translation" placeholder="ترجمه حدیث"></textarea>
<label>🏷️ موضوع / برچسب</label>
<input id="tags" placeholder="مثلاً علم، ایمان، اخلاق">

<button class="primary" onclick="addHadith()">💾 ذخیره حدیث</button>
<button class="secondary" onclick="clearForm()">پاک کردن فرم</button>
<div id="saveMsg" class="small"></div>
</div>

<div class="card">
<h2>🔎 جستجو</h2>
<input id="search" oninput="render()" placeholder="کلمه، نام شخص، کتاب، جلد، فصل یا شماره حدیث...">
<div class="grid">
<input id="filterPerson" oninput="render()" placeholder="فیلتر شخص">
<input id="filterBook" oninput="render()" placeholder="فیلتر کتاب">
</div>
<div id="count" class="small"></div>
<div id="results"></div>
</div>

<div class="card">
<h2>💾 پشتیبان‌گیری</h2>
<button class="secondary" onclick="exportData()">⬇️ ذخیره پشتیبان</button>
<button class="secondary" onclick="document.getElementById('importFile').click()">⬆️ برگرداندن پشتیبان</button>
<input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)">
<button class="danger" onclick="deleteAll()">حذف همه حدیث‌ها</button>
<p class="small">پشتیبان یک فایل JSON است و می‌توانی آن را در Files آیفون نگه داری.</p>
</div>
</div>

<script>
const KEY="my_hadith_library_v1";
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]"); if(!Array.isArray(data))data=[];}catch(e){data=[];}

function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){return false}}
function val(id){return document.getElementById(id).value.trim()}
function addHadith(){
 const h={id:Date.now().toString(),person:val("person"),book:val("book"),volume:val("volume"),chapter:val("chapter"),number:val("number"),page:val("page"),text:val("text"),translation:val("translation"),tags:val("tags")};
 if(!h.text && !h.translation){alert("لطفاً حداقل متن حدیث یا ترجمه را وارد کن.");return}
 data.unshift(h);
 const ok=save();
 clearForm();
 document.getElementById("saveMsg").textContent=ok?"✅ حدیث ذخیره شد.":"⚠️ حدیث در این مرورگر ذخیره نشد؛ از «پشتیبان‌گیری» استفاده کن.";
 render();
}
function clearForm(){["person","book","volume","chapter","number","page","text","translation","tags"].forEach(x=>document.getElementById(x).value="")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function highlight(s,q){
 let out=esc(s); if(!q)return out;
 q=q.trim().split(/\s+/).filter(Boolean).slice(0,8);
 for(const word of q){if(word.length<1)continue; const re=new RegExp("("+word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");out=out.replace(re,"<mark>$1</mark>")}
 return out;
}
function render(){
 const q=val("search").toLowerCase(), fp=val("filterPerson").toLowerCase(), fb=val("filterBook").toLowerCase();
 const arr=data.filter(h=>{
  const all=Object.values(h).join(" ").toLowerCase();
  return (!q||all.includes(q))&&(!fp||h.person.toLowerCase().includes(fp))&&(!fb||h.book.toLowerCase().includes(fb));
 });
 document.getElementById("count").textContent=`${arr.length} حدیث پیدا شد`;
 const box=document.getElementById("results");
 if(!arr.length){box.innerHTML='<div class="empty">هنوز حدیثی مطابق جستجو پیدا نشد.</div>';return}
 box.innerHTML=arr.map(h=>`
 <div class="result">
 <div class="meta">👤 ${esc(h.person)}　📚 ${esc(h.book)}　📖 جلد ${esc(h.volume)}　🔢 حدیث ${esc(h.number)}　📄 صفحه ${esc(h.page)}<br>📑 ${esc(h.chapter)}　🏷️ ${esc(h.tags)}</div>
 <div class="hadith">${highlight(h.text,q)}</div>
 ${h.translation?`<div><b>ترجمه:</b> ${highlight(h.translation,q)}</div>`:""}
 <button class="danger" onclick="removeHadith('${h.id}')">حذف</button>
 </div>`).join("");
}
function removeHadith(id){if(confirm("این حدیث حذف شود؟")){data=data.filter(h=>h.id!==id);save();render()}}
function deleteAll(){if(confirm("همه حدیث‌ها حذف شوند؟")){data=[];save();render()}}
function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hadith-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;data=x;save();render();alert("✅ پشتیبان با موفقیت برگردانده شد.")}catch(e){alert("فایل پشتیبان معتبر نیست.")}};r.readAsText(f);e.target.value="";
}
render();
</script>
</body>
</html>
